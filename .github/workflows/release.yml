name: Release

# Triggered when you push a tag like v0.1.0, v0.1.1, v0.2.0, etc.
on:
  push:
    tags: ['v*']

permissions:
  contents: write   # needed by softprops/action-gh-release to create releases

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Build standalone exe with PyInstaller
        run: |
          pyinstaller --name QuitAllWin --windowed --onefile --noconfirm --clean launcher.py

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer\QuitAllWin.iss

      - name: Show outputs
        run: |
          Get-ChildItem dist -Recurse -Filter *.exe

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/QuitAllWin.exe
            dist/installer/QuitAllWin-Setup-*.exe
